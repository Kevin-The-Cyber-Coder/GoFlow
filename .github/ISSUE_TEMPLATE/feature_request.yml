name: Feature request
description: Propose a capability or an improvement
title: 'feat: '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution — it makes it much easier to
        judge whether the proposed shape is the right one.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today, or what is unnecessarily hard?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The behaviour you would like, from the user's point of view.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, or other designs you rejected.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API
        - Web client
        - Database / migrations
        - Tooling / CI
        - Documentation
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Mockups, links, or constraints worth knowing about.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
