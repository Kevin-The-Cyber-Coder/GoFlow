<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoFlow — Freelance business management</title>
    <meta
      name="description"
      content="GoFlow brings clients, invoices, payments and income reports together in one calm workspace built for freelancers."
    />
    <meta name="theme-color" content="#3f5efb" />
    <meta name="color-scheme" content="light" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233f5efb'/%3E%3Cpath d='M22.5 11.8a8 8 0 1 0 1.5 6.2h-7' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />

    <!-- Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GoFlow" />
    <meta property="og:title" content="GoFlow — Freelance business management" />
    <meta
      property="og:description"
      content="Clients, invoices, payments and income reports in a single workspace built for freelancers."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="GoFlow — Freelance business management" />
    <meta
      name="twitter:description"
      content="Clients, invoices, payments and income reports in a single workspace built for freelancers."
    />

    <!--
      The splash is inline so it renders before the CSS bundle and the React
      bundle finish loading. React replaces it when the app mounts in #root.
    -->
    <style>
      :root {
        --goflow-brand: #3f5efb;
        --goflow-brand-soft: #eef1ff;
        --goflow-ink: #0f172a;
        --goflow-muted: #64748b;
      }

      .app-splash {
        display: flex;
        min-height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        background: #f8fafc;
        color: var(--goflow-ink);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        text-align: center;
      }

      .app-splash__mark {
        display: grid;
        width: 3rem;
        height: 3rem;
        margin-bottom: 0.5rem;
        place-items: center;
        border-radius: 0.9rem;
        background: var(--goflow-brand);
        color: #fff;
        font-size: 1.25rem;
        font-weight: 700;
      }

      .app-splash__title {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .app-splash__hint {
        margin: 0;
        color: var(--goflow-muted);
        font-size: 0.875rem;
      }

      .app-splash__spinner {
        width: 1.25rem;
        height: 1.25rem;
        margin-top: 1rem;
        border: 2px solid var(--goflow-brand-soft);
        border-top-color: var(--goflow-brand);
        border-radius: 9999px;
        animation: app-splash-spin 0.8s linear infinite;
      }

      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-splash__spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="h-full">
    <div id="root" class="h-full">
      <div class="app-splash" role="status" aria-live="polite">
        <div class="app-splash__mark" aria-hidden="true">G</div>
        <p class="app-splash__title">GoFlow</p>
        <p class="app-splash__hint">Loading your workspace…</p>
        <span class="app-splash__spinner" aria-hidden="true"></span>
      </div>
    </div>

    <noscript>
      <div class="app-splash">
        <p class="app-splash__title">GoFlow needs JavaScript</p>
        <p class="app-splash__hint">Enable JavaScript in your browser to use the workspace.</p>
      </div>
    </noscript>

    <script type="module" src="/main.tsx"></script>
  </body>
</html>
