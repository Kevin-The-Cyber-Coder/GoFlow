server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # API traffic keeps the same origin as the app, which removes CORS from the
  # browser's list of problems and matches how the production deployment runs.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed assets are immutable; the HTML entry point must never be cached or
  # users keep loading a stale bundle after a deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
